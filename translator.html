<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>간단한 텍스트 번역기</title>
<style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#202534;background:#f3f5f9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(840px,100%);background:white;border:1px solid #e4e8f0;box-shadow:0 14px 35px #132f6310;border-radius:22px;padding:30px}h1{margin:0 0 6px;font-size:26px;letter-spacing:-.7px}p{margin:0 0 24px;color:#687286;font-size:14px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px}.toolbar label{flex:1}select{width:100%;font:inherit;border:1px solid #dce2eb;border-radius:10px;background:white;padding:12px}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 18px;font-weight:600}button:disabled{opacity:.6;cursor:wait}.swap{background:#eef2fb;font-size:19px;padding:10px 14px}.panes{display:grid;grid-template-columns:1fr 1fr;gap:16px}.pane{border:1px solid #dfe4ed;border-radius:15px;overflow:hidden}.pane-header{padding:12px 15px;font-weight:650;font-size:14px;border-bottom:1px solid #edf0f5;display:flex;justify-content:space-between;align-items:center}.pane textarea{height:240px;width:100%;resize:vertical;padding:16px;font:16px/1.65 inherit;border:0;outline:none;background:transparent;color:inherit}.pane textarea[readonly]{background:#f9fafc}.count{font-weight:400;color:#8991a2;font-size:12px}.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}.primary{background:#346be6;color:white;min-width:150px}.secondary{background:#eef2fb;color:#2a487e}.status{font-size:13px;color:#596b85;min-height:20px}.note{font-size:12px;margin:20px 0 0;color:#8790a0;line-height:1.6}@media(max-width:620px){main{padding:20px}.panes{grid-template-columns:1fr}.pane textarea{height:170px}h1{font-size:23px}}
</style>
</head>
<body><main>
<h1>🌐 텍스트 번역기</h1>
<p>문장을 입력하고 번역할 언어를 선택하세요.</p>
<div class="toolbar">
<label><select id="source" aria-label="원본 언어"><option value="auto">언어 자동 감지</option><option value="ko">한국어</option><option value="en">영어</option><option value="ja">일본어</option><option value="zh-CN">중국어(간체)</option><option value="es">스페인어</option><option value="fr">프랑스어</option></select></label>
<button class="swap" id="swap" aria-label="언어 바꾸기" title="언어 바꾸기">⇄</button>
<label><select id="target" aria-label="번역 언어"><option value="en">영어</option><option value="ko">한국어</option><option value="ja">일본어</option><option value="zh-CN">중국어(간체)</option><option value="es">스페인어</option><option value="fr">프랑스어</option></select></label>
</div>
<div class="panes"><section class="pane"><div class="pane-header">원문 <span class="count" id="count">0 / 500자</span></div><textarea id="input" maxlength="500" placeholder="번역할 문장을 입력하세요."></textarea></section><section class="pane"><div class="pane-header">번역 결과</div><textarea id="output" readonly placeholder="번역 결과가 여기에 표시됩니다."></textarea></section></div>
<div class="actions"><div><button class="primary" id="translate">번역하기</button> <button class="secondary" id="copy">결과 복사</button> <button class="secondary" id="external">Google 번역으로 열기 ↗</button></div><span id="status" class="status" role="status" aria-live="polite"></span></div>
<p class="note">무료 MyMemory 번역 서비스를 사용하고 실패 시 다른 번역 경로를 시도합니다. 번역 서비스의 일일 사용량 제한과 네트워크 상태에 따라 결과가 달라질 수 있습니다. 입력한 문장은 외부 번역 서버로 전송되므로 개인정보나 업무상 기밀은 입력하지 마세요. 자동 감지는 기본 언어 추정 방식으로 처리합니다.</p>
</main>
<script>
const $=id=>document.getElementById(id), input=$('input'),output=$('output'),source=$('source'),target=$('target'),status=$('status'),btn=$('translate');
input.addEventListener('input',()=>{$('count').textContent=`${input.value.length} / 500자`;});
function detect(text){if(/[가-힣]/.test(text))return 'ko';if(/[ぁ-ゟ゠-ヿ]/.test(text))return 'ja';if(/[\u3400-\u9fff]/.test(text))return 'zh-CN';return 'en';}
$('swap').addEventListener('click',()=>{const a=source.value==='auto'?detect(input.value):source.value,b=target.value;source.value=b;target.value=a;const old=input.value;input.value=output.value;output.value=old;input.dispatchEvent(new Event('input'));status.textContent='';});
function googleUrl(text, from, to){
 const u=new URL('https://translate.google.com/');
 u.searchParams.set('sl',from);u.searchParams.set('tl',to);u.searchParams.set('text',text);u.searchParams.set('op','translate');
 return u.toString();
}
$('external').addEventListener('click',()=>{
 const text=input.value.trim();if(!text){status.textContent='번역할 문장을 먼저 입력해 주세요.';return;}
 window.open(googleUrl(text,source.value,target.value),'_blank','noopener,noreferrer');
});
async function myMemory(text,from,to){
 // MyMemory has a 500-BYTE query limit; split without breaking UTF-8 code points.
 const pieces=[];let chunk='';const encoder=new TextEncoder();
 for(const c of text){
  if(encoder.encode(chunk+c).length>450){if(chunk)pieces.push(chunk);chunk=c;}else chunk+=c;
 }
 if(chunk)pieces.push(chunk);
 let translated=[];
 for(const piece of pieces){
  const u=new URL('https://api.mymemory.translated.net/get');
  u.searchParams.set('q',piece);u.searchParams.set('langpair',`${from}|${to}`);
  const res=await fetch(u.toString(),{signal:AbortSignal.timeout(12000)});
  if(!res.ok)throw new Error('MyMemory HTTP '+res.status);
  const data=await res.json();
  if(Number(data.responseStatus)!==200 || !data.responseData?.translatedText || data.quotaFinished)throw new Error(data.responseDetails||'MyMemory 서비스 제한');
  const doc=new DOMParser().parseFromString(data.responseData.translatedText,'text/html');
  translated.push(doc.documentElement.textContent||'');
 }
 return translated.join('');
}
async function secondaryTranslate(text,from,to){
 // Unofficial public endpoint; best-effort fallback only, not guaranteed.
 const u=new URL('https://translate.googleapis.com/translate_a/single');
 for(const [k,v] of Object.entries({client:'gtx',sl:from,tl:to,dt:'t',q:text}))u.searchParams.set(k,v);
 const res=await fetch(u.toString(),{signal:AbortSignal.timeout(12000)});
 if(!res.ok)throw new Error('보조 서비스 HTTP '+res.status);
 const data=await res.json();
 const result=Array.isArray(data?.[0])?data[0].map(a=>a?.[0]||'').join(''):'';
 if(!result)throw new Error('보조 서비스 응답 오류');
 return result;
}
$('translate').addEventListener('click',async()=>{
 const text=input.value.trim();if(!text){status.textContent='번역할 문장을 입력해 주세요.';input.focus();return;}
 const from=source.value==='auto'?detect(text):source.value,to=target.value;
 if(from===to){output.value=text;status.textContent='같은 언어이므로 원문을 표시했어요.';return;}
 btn.disabled=true;btn.textContent='번역 중…';status.textContent='번역 요청 중';output.value='';
 try{
  try{output.value=await myMemory(text,from,to);status.textContent='번역 완료';}
  catch(firstError){
   status.textContent='기본 번역 서비스를 사용할 수 없어 다른 경로로 시도 중…';
   try{output.value=await secondaryTranslate(text,from,to);status.textContent='번역 완료 (보조 서비스)';}
   catch(secondError){throw new Error('무료 번역 서비스 연결 또는 사용량 제한');}
  }
 }catch(e){status.textContent=`${e.message}. 오른쪽의 'Google 번역으로 열기'를 이용해 주세요.`;}
 finally{btn.disabled=false;btn.textContent='번역하기';}
});
$('copy').addEventListener('click',async()=>{if(!output.value){status.textContent='복사할 번역 결과가 없어요.';return;}try{await navigator.clipboard.writeText(output.value);status.textContent='번역 결과를 복사했어요.';}catch{output.focus();output.select();status.textContent='결과를 선택했어요. Ctrl+C로 복사해 주세요.';}});
</script></body></html>
